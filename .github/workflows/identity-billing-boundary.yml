name: SpinFamily identity and billing boundary
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'netlify/functions/**'
      - 'netlify/database/migrations/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/identity-billing-boundary.yml'
  push:
    branches:
      - 'work/billing-isolated-db-2026-10-13'
jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated unit tests
        run: npm test
      - name: Check ESM handler syntax
        run: |
          node --check netlify/functions/household-activities.mjs
          node --check netlify/functions/plus-checkout.mjs
          node --check netlify/functions/plus-portal.mjs
          node --check netlify/functions/stripe-webhook.mjs
          node --check netlify/functions/custom-activity.cjs
