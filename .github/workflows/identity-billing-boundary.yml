name: SpinFamily identity and billing boundary
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'server/**'
      - 'src/**'
      - 'netlify/functions/**'
      - 'netlify/database/migrations/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/identity-billing-boundary.yml'
  push:
    branches:
      - 'work/billing-isolated-db-2026-10-13'
      - 'work/release-verification-2026-10-15'
jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run isolated unit tests
        run: npm test
      - name: Check ESM handler syntax
        run: |
          node --check netlify/functions/household-activities.mjs
          node --check netlify/functions/plus-checkout.mjs
          node --check netlify/functions/plus-portal.mjs
          node --check netlify/functions/stripe-webhook.mjs
          node --check netlify/functions/custom-activity.cjs
  database-migration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spinfamily
          POSTGRES_PASSWORD: spinfamily_test_only
          POSTGRES_DB: spinfamily_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spinfamily -d spinfamily_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgres://spinfamily:spinfamily_test_only@localhost:5432/spinfamily_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies for isolated migration test
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run schema integration and boundary tests
        run: npm test
      - name: Build production-equivalent static bundle
        run: npm run build
      - name: Verify bundled assets
        run: |
          test -s dist/index.html
          test -s dist/assets/plus-client.js
          test -f dist/assets/activities/manifest.json
