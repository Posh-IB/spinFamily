name: SpinFamily isolated Plus engineering QA
on:
  workflow_dispatch:
  pull_request:
    branches: [work/identity-subscriptions-2026-10-11]
  push:
    branches: [work/plus-lifecycle-hardening-2026-10-12]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Actual browser guest, artwork and warm baseline
        run: |
          python3 -m http.server 4317 --bind 127.0.0.1 --directory dist > /tmp/spinfamily-static.log 2>&1 &
          node tests/browser-participant-wheel.cjs
          node tests/browser-activity-art.cjs
          node tests/browser-plus-guest.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spinfamily-plus-browser-evidence
          path: qa-screenshots/
